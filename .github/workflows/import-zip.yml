name: Import Project ZIP

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose an operation"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean

permissions:
  contents: write

jobs:
  project-manager:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # ==================================================
      # CHECK GH_PAT
      # ==================================================
      - name: Verify GH_PAT
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is missing."
            exit 1
          fi

          echo "GH_PAT secret is available."

      # ==================================================
      # CLEAN
      #
      # Keeps:
      #   .git
      #   .github/workflows
      #   ZIP files
      # ==================================================
      - name: Clean repository
        if: ${{ inputs.operation == 'clean' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -iname "*.zip" \
            -exec rm -rf {} +

          if [ -d ".github" ]; then
            find .github -mindepth 1 -maxdepth 1 \
              ! -name "workflows" \
              -exec rm -rf {} +
          fi

          echo ""
          echo "Clean completed."

          echo ""
          echo "Remaining files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      # ==================================================
      # FIND ZIP
      # ==================================================
      - name: Find ZIP
        if: ${{ inputs.operation == 'import' }}
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -printf "%f\n" \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file found."
            echo ""
            echo "Found:"
            printf ' - %s\n' "${ZIPS[@]}"
            echo ""
            echo "Keep only ONE ZIP file in the repository root."
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          echo "ZIP found: $ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      # ==================================================
      # EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        env:
          ZIP_NAME: ${{ steps.find_zip.outputs.ZIP_NAME }}
        run: |
          set -euo pipefail

          rm -rf /tmp/portfolio-import
          mkdir -p /tmp/portfolio-import

          unzip -q -o "$ZIP_NAME" -d /tmp/portfolio-import

          echo "ZIP extracted successfully."

      # ==================================================
      # DETECT PROJECT ROOT
      # ==================================================
      - name: Detect project root
        if: ${{ inputs.operation == 'import' }}
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/portfolio-import"

          echo "Checking ZIP structure..."

          # -----------------------------------------------
          # Case 1:
          # Files are directly inside ZIP
          # -----------------------------------------------
          if [ -f "$ROOT/package.json" ] || \
             [ -f "$ROOT/index.html" ] || \
             [ -f "$ROOT/main.py" ] || \
             [ -f "$ROOT/requirements.txt" ] || \
             [ -d "$ROOT/src" ] || \
             [ -d "$ROOT/app" ]; then

            echo "Project files detected directly inside ZIP."
            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -----------------------------------------------
          # Case 2:
          # ZIP contains one project folder
          # -----------------------------------------------
          mapfile -t DIRS < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf "%p\n"
          )

          mapfile -t FILES < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              -printf "%p\n"
          )

          if [ "${#DIRS[@]}" -eq 1 ] && \
             [ "${#FILES[@]}" -eq 0 ]; then

            echo "Single project folder detected."
            echo "ROOT=${DIRS[0]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Could not determine project root."
          echo ""
          echo "ZIP structure:"
          find "$ROOT" -maxdepth 3 -print | sort
          exit 1

      # ==================================================
      # VALIDATE PROJECT
      # ==================================================
      - name: Validate project
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        env:
          ROOT: ${{ steps.project_root.outputs.ROOT }}
        run: |
          set -euo pipefail

          echo "Validating project..."
          echo "Root: $ROOT"

          if [ ! -f "$ROOT/package.json" ] && \
             [ ! -f "$ROOT/index.html" ]; then

            echo "::error::The ZIP does not appear to contain a valid portfolio project."
            echo ""
            echo "Expected at least package.json or index.html."
            exit 1
          fi

          echo "Project validation passed."

      # ==================================================
      # REMOVE OLD PORTFOLIO
      #
      # IMPORTANT:
      # .github is preserved so this workflow cannot
      # accidentally delete itself.
      # ==================================================
      - name: Remove old portfolio
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old portfolio files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -iname "*.zip" \
            -exec rm -rf {} +

          echo "Old portfolio removed."

      # ==================================================
      # IMPORT NEW PORTFOLIO
      #
      # .github from ZIP is deliberately ignored.
      # This protects the workflow itself.
      # ==================================================
      - name: Import new portfolio
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        env:
          ROOT: ${{ steps.project_root.outputs.ROOT }}
        run: |
          set -euo pipefail

          echo "Importing new portfolio..."

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            "$ROOT/" ./

          echo "Portfolio imported successfully."

      # ==================================================
      # REMOVE ZIP
      # ==================================================
      - name: Remove ZIP
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -delete

          echo "ZIP removed."

      # ==================================================
      # SHOW FINAL STRUCTURE
      # ==================================================
      - name: Verify final repository
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "========================================"
          echo "FINAL REPOSITORY"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      # ==================================================
      # COMMIT
      # ==================================================
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          if [ "${{ inputs.operation }}" = "clean" ]; then
            git commit -m "chore: clean repository"
          else
            git commit -m "chore: import portfolio from ZIP"
          fi

      # ==================================================
      # PUSH USING GH_PAT
      # ==================================================
      - name: Push changes
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is missing."
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "========================================"
          echo "Operation: ${{ inputs.operation }}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "========================================"
