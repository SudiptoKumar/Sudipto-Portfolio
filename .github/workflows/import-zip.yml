name: Portfolio ZIP Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to do"
        required: true
        type: choice
        options:
          - import
          - clean
        default: import

permissions:
  contents: write

jobs:
  manage-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show repository state
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Action: ${{ inputs.action }}"
          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort

      # ---------------------------------------------------------
      # CLEAN
      # ---------------------------------------------------------
      - name: Clean old portfolio
        if: inputs.action == 'clean'
        shell: bash
        run: |
          set -e

          echo "Cleaning old portfolio files..."

          # Keep Git metadata and this workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '*.zip' \
            -exec rm -rf {} +

          echo "Clean completed."

      # ---------------------------------------------------------
      # IMPORT
      # ---------------------------------------------------------
      - name: Find portfolio ZIP
        if: inputs.action == 'import'
        id: find_zip
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname '*.zip' \
            -printf '%f\n' | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in the repository root."
            echo "Upload your portfolio ZIP to the repository root first."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file was found:"
            printf ' - %s\n' "${ZIPS[@]}"
            echo "Keep only ONE portfolio ZIP in the repository root."
            exit 1
          fi

          ZIP_NAME="${ZIPS[0]}"

          echo "ZIP found: $ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare import workspace
        if: inputs.action == 'import'
        shell: bash
        run: |
          set -e

          rm -rf .portfolio-import
          mkdir -p .portfolio-import

          echo "Workspace prepared."

      - name: Extract portfolio ZIP
        if: inputs.action == 'import'
        shell: bash
        env:
          ZIP_NAME: ${{ steps.find_zip.outputs.zip_name }}
        run: |
          set -e

          echo "Extracting: $ZIP_NAME"

          unzip -q "$ZIP_NAME" -d .portfolio-import

          echo "Extracted files:"
          find .portfolio-import -maxdepth 3 -type f | sort | head -200

      - name: Locate portfolio root
        if: inputs.action == 'import'
        id: locate
        shell: bash
        run: |
          set -e

          ROOT=".portfolio-import"

          # If ZIP contains one top-level directory, use it.
          mapfile -t DIRS < <(
            find .portfolio-import -mindepth 1 -maxdepth 1 -type d \
            ! -name '.git' \
            -printf '%p\n'
          )

          mapfile -t FILES < <(
            find .portfolio-import -mindepth 1 -maxdepth 1 -type f \
            -printf '%p\n'
          )

          if [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
            ROOT="${DIRS[0]}"
          fi

          echo "Portfolio root: $ROOT"
          echo "portfolio_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate portfolio
        if: inputs.action == 'import'
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.portfolio_root }}
        run: |
          set -e

          echo "Validating portfolio..."

          if [ ! -f "$ROOT/package.json" ]; then
            echo "::error::package.json was not found."
            echo "The uploaded ZIP does not appear to contain the portfolio project."
            exit 1
          fi

          if [ ! -f "$ROOT/index.html" ]; then
            echo "::error::index.html was not found."
            echo "The uploaded ZIP does not appear to contain the portfolio project."
            exit 1
          fi

          echo "Validation passed."

      - name: Remove old portfolio
        if: inputs.action == 'import'
        shell: bash
        run: |
          set -e

          echo "Removing old portfolio files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '*.zip' \
            ! -name '.portfolio-import' \
            -exec rm -rf {} +

          echo "Old portfolio removed."

      - name: Import new portfolio
        if: inputs.action == 'import'
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.portfolio_root }}
        run: |
          set -e

          echo "Importing new portfolio..."

          cp -a "$ROOT"/. .

          echo "New portfolio imported."

      - name: Protect GitHub workflow
        if: inputs.action == 'import'
        shell: bash
        run: |
          set -e

          # Never allow the uploaded ZIP to replace this management workflow.
          git checkout -- .github/workflows/import-zip.yml 2>/dev/null || true

          # Remove imported Git metadata if the ZIP contained it.
          rm -rf .git

          # Restore repository metadata because the previous command above
          # would remove the checkout's Git directory.
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

          echo "Workflow protection completed."

      - name: Remove temporary files
        if: inputs.action == 'import'
        shell: bash
        run: |
          set -e

          rm -rf .portfolio-import

          find . -maxdepth 1 -type f -iname '*.zip' -delete

          echo "Temporary files removed."

      # ---------------------------------------------------------
      # SHOW RESULT
      # ---------------------------------------------------------
      - name: Show final files
        shell: bash
        run: |
          echo "Final repository:"
          echo ""

          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort

      # ---------------------------------------------------------
      # COMMIT
      # ---------------------------------------------------------
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          if [ "${{ inputs.action }}" = "import" ]; then
            git commit -m "chore: import portfolio update"
          else
            git commit -m "chore: clean portfolio repository"
          fi

      - name: Push changes
        shell: bash
        run: |
          set -e

          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Changes pushed successfully."
