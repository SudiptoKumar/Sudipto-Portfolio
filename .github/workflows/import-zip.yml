name: Import Project ZIP

# Starts by itself when a ZIP file is pushed to the repository root.
# Works on any branch and with any project type (Python, TypeScript, and so on).
# No manual inputs. No GH_PAT needed (see notes below about .github/workflows).
#
# Files that must survive every import: write one path per line in a file
# named .keep-files in the repository root (lines with # are notes).
#
# This one file does everything:
#   1. Automatic: push a ZIP to the repository root -> project is imported.
#   2. Manual: Actions > "Import Project ZIP" > Run workflow, then pick:
#        restore       Put the repository back to a backup tag (one click).
#                      Leave "backup_tag" empty to use the newest backup tag.
#        clean-repo    Delete all files (a backup tag is made first).
#        clean-deploy  Delete the Deployments history.
#      Just pick one and press Run. No other setting is needed.
#
# Manual actions add a NEW commit. Old history is never rewritten.
# Files in .github/workflows and .keep-files are never removed by them.
# The Run button shows only when this file is on the default branch.
on:
  push:
    branches: ["**"]
    paths:
      - "*.zip"
      - "*.ZIP"
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        type: choice
        required: true
        options:
          - restore
          - clean-repo
          - clean-deploy
      backup_tag:
        description: "Only for restore: tag name. Leave empty = newest backup"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # needed to delete old workflow runs
  pull-requests: write   # only used when PR_MODE is "true"
  deployments: write   # needed by clean-deploy

# Only one import at a time. A second upload waits for the first one.
concurrency:
  group: import-project-zip
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Optional: files that must survive every import (space separated).
  # Example: PRESERVE_FILES: "news_state.json posted_urls.txt"
  # You can also list them (one per line) in a .keep-files file in the repo.
  PRESERVE_FILES: ""

  # ZIP safety checks. The import stops if a limit is passed.
  MAX_ZIP_MB: "200"          # size of the ZIP file
  MAX_UNZIPPED_MB: "1000"    # size after unzip (protects from ZIP bombs)
  MAX_FILES: "50000"         # number of files in the ZIP
  MAX_FILE_MB: "100"         # one file (GitHub rejects files above 100 MB)
  BLOCK_SECRET_FILES: "true" # stop if the ZIP has .env, private keys, etc.

  # Bad ZIP check: stop if the import would remove more than this percent
  # of the old files. 0 = check is off.
  # If you really want it, put the word "force" in the ZIP file name.
  MAX_REMOVED_PERCENT: "80"

  # "true" = open a pull request for you to check and merge.
  # "false" = push straight to the branch.
  # Needs: Settings > Actions > General > "Allow GitHub Actions to create
  # and approve pull requests".
  PR_MODE: "false"

  # Make a backup tag before the repository is cleaned ("true" or "false").
  # The newest BACKUP_KEEP backup tags are kept (import and clean-repo
  # backups together). Older backup tags are deleted every time a new one
  # is made. To go back later, use the "restore" manual action.
  BACKUP_TAG: "true"
  BACKUP_KEEP: "3"

  # clean-deploy: how many newest deployments to keep (0 = delete all).
  DEPLOY_KEEP_LATEST: "1"
  # clean-deploy: only this environment name (empty = all environments).
  DEPLOY_ENVIRONMENT: ""

  # Old run history: keep this many newest finished runs.
  KEEP_RUNS: "5"
  # Delete only runs older than this many days. 0 = no age limit.
  DELETE_RUNS_OLDER_THAN_DAYS: "0"

  # Start these workflows after a successful import (space separated).
  # Example: TRIGGER_WORKFLOWS: "build.yml deploy.yml"
  # Each one needs "workflow_dispatch:" in its "on:" list.
  TRIGGER_WORKFLOWS: ""

  # "true" only if you added a GH_PAT secret. Without it, GITHUB_TOKEN is used.
  PAT_AVAILABLE: ${{ secrets.GH_PAT != '' }}

jobs:
  import:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      # ==================================================
      # 1 + 2. DETECT ZIP AND ALLOW ONLY ONE
      # ==================================================
      - name: Detect ZIP
        id: find
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip" | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::notice::No ZIP file in repository root. Nothing to import."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Only one ZIP file is allowed in the repository root."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "Found: ${ZIPS[0]}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      # ==================================================
      # 3 + 4. VALIDATE ZIP (not corrupted, safe paths)
      # ==================================================
      - name: Validate ZIP
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail

          ZIP_BYTES="$(stat -c%s "$ZIP")"
          if [ "$ZIP_BYTES" -gt $((MAX_ZIP_MB * 1024 * 1024)) ]; then
            echo "::error::The ZIP file is bigger than ${MAX_ZIP_MB} MB."
            exit 1
          fi

          if ! unzip -tq "$ZIP" > /dev/null; then
            echo "::error::The ZIP file is corrupted or not a valid ZIP."
            exit 1
          fi

          LIST="$(mktemp)"
          unzip -Z1 "$ZIP" > "$LIST"

          if [ ! -s "$LIST" ]; then
            echo "::error::The ZIP file is empty."
            exit 1
          fi

          # Reject: absolute paths, drive letters, backslashes, ".." parts.
          if grep -qE '^/|^[A-Za-z]:|\\|(^|/)\.\.(/|$)' "$LIST"; then
            echo "::error::Unsafe path found in ZIP (path traversal). Import stopped."
            grep -nE '^/|^[A-Za-z]:|\\|(^|/)\.\.(/|$)' "$LIST" | head -20
            exit 1
          fi

          # Number of files and size after unzip.
          STATS="$(unzip -Zt "$ZIP")"
          FILE_COUNT="$(printf '%s\n' "$STATS" | awk '{print $1}')"
          RAW_BYTES="$(printf '%s\n' "$STATS" | awk '{print $3}')"

          if [ "$FILE_COUNT" -gt "$MAX_FILES" ]; then
            echo "::error::The ZIP has $FILE_COUNT files. The limit is $MAX_FILES."
            exit 1
          fi
          if [ "$RAW_BYTES" -gt $((MAX_UNZIPPED_MB * 1024 * 1024)) ]; then
            echo "::error::The ZIP is bigger than ${MAX_UNZIPPED_MB} MB after unzip."
            exit 1
          fi

          # Secret files. Example files like .env.example are allowed.
          if [ "$BLOCK_SECRET_FILES" = "true" ]; then
            SECRETS="$(grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|\.pem$|\.p12$|\.pfx$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' "$LIST" \
              | grep -viE '\.env\.(example|sample|template|dist)$' || true)"
            if [ -n "$SECRETS" ]; then
              echo "::error::The ZIP has files that look like secrets. Import stopped."
              printf '%s\n' "$SECRETS" | head -20
              echo "Remove them from the ZIP, or set BLOCK_SECRET_FILES to false."
              exit 1
            fi
          fi

          echo "ZIP is valid and safe. Files: $FILE_COUNT"

      # ==================================================
      # 5. COPY ZIP TO TEMP + BACK UP IMPORTER WORKFLOW
      # ==================================================
      - name: Back up ZIP and importer workflow
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/zip-import"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/workflows" "$STAGE/keep"

          # ZIP copy
          cp "$ZIP" "$STAGE/upload.zip"

          # Path of the workflow that is running now
          WF_PATH="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          WF_PATH="${WF_PATH%%@*}"
          echo "Importer workflow: $WF_PATH"

          if [ ! -f "$WF_PATH" ]; then
            echo "::error::Cannot find the importer workflow file: $WF_PATH"
            exit 1
          fi
          echo "$WF_PATH" > "$STAGE/workflow-path.txt"

          if [ "$PAT_AVAILABLE" = "true" ]; then
            # Keep only this workflow file.
            cp -p --parents "$WF_PATH" "$STAGE/workflows/"
          else
            # GITHUB_TOKEN cannot change anything in .github/workflows,
            # so keep that whole folder exactly as it is.
            mkdir -p "$STAGE/workflows/.github"
            cp -a .github/workflows "$STAGE/workflows/.github/"
          fi

          # Files and folders to keep: PRESERVE_FILES + the .keep-files file.
          KEEP_LIST="$STAGE/keep-list.txt"
          printf '%s\n' ".keep-files" > "$KEEP_LIST"

          read -ra ITEMS <<< "$PRESERVE_FILES"
          for item in "${ITEMS[@]}"; do
            printf '%s\n' "$item" >> "$KEEP_LIST"
          done

          if [ -f .keep-files ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                ''|'#'*) continue ;;
              esac
              printf '%s\n' "$line" >> "$KEEP_LIST"
            done < .keep-files
          fi

          while IFS= read -r p; do
            p="${p#./}"
            p="${p%/}"
            if [ -z "$p" ]; then
              continue
            fi
            case "$p" in
              /*|..|../*|*/..|*/../*|.git|.git/*)
                echo "::error::Not allowed in the keep list: $p"
                exit 1
                ;;
            esac
            if [ -e "$p" ]; then
              rsync -aR -- "$p" "$STAGE/keep/"
              echo "Keeping: $p"
            fi
          done < <(sort -u "$KEEP_LIST")

      # ==================================================
      # BACKUP TAG
      # A bookmark of the repository before it is cleaned.
      # The new ZIP file is NOT included in the backup.
      # After the new tag is saved, only the newest BACKUP_KEEP tags stay.
      # ==================================================
      - name: Create backup tag
        if: steps.find.outputs.found == 'true' && env.BACKUP_TAG == 'true'
        id: backup
        run: |
          set -euo pipefail

          TAG="backup-before-import-${GITHUB_RUN_ID}"

          # Make a backup commit that is the same as now, but without the
          # new ZIP file. The ZIP is the upload, not part of the old project.
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          export GIT_INDEX_FILE="$RUNNER_TEMP/backup-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree HEAD

          while IFS= read -r -d '' f; do
            git rm -r -q --cached -- "$f"
            echo "Not in backup: $f"
          done < <(git ls-tree -z --name-only HEAD | grep -zi '\.zip$' || true)

          BACKUP_TREE="$(git write-tree)"
          BACKUP_COMMIT="$(git commit-tree "$BACKUP_TREE" -p HEAD -m "Backup before import $GITHUB_RUN_ID")"
          unset GIT_INDEX_FILE

          git tag "$TAG" "$BACKUP_COMMIT"

          if git push origin "refs/tags/$TAG"; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Backup tag created: $TAG"

            # Keep the newest BACKUP_KEEP backup tags. Delete the rest.
            # Tags end with the run number, so a bigger number is newer.
            git ls-remote --tags --refs origin 'refs/tags/backup-*' \
              | awk '{print $2}' \
              | sed 's|^refs/tags/||' \
              | awk -F- '{print $NF, $0}' \
              | sort -rn \
              | awk -v keep="$BACKUP_KEEP" 'NR>keep {print $2}' \
              | while read -r OLD; do
                  if [ "$OLD" = "$TAG" ]; then
                    continue
                  fi
                  if git push origin --delete "refs/tags/$OLD"; then
                    echo "Removed old backup tag: $OLD"
                  else
                    echo "::warning::Could not remove old backup tag: $OLD"
                  fi
                done
          else
            echo "::warning::Could not push the backup tag. Old backup tags are kept."
          fi

      # ==================================================
      # 6. CLEAN REPOSITORY (all except .git)
      # The importer workflow is restored later.
      # ==================================================
      - name: Clean repository
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          echo "Repository cleaned. Remaining at root:"
          ls -A

      # ==================================================
      # 7. EXTRACT ZIP
      # ==================================================
      - name: Extract ZIP
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/zip-import"
          EX="$STAGE/extract"
          mkdir -p "$EX"

          unzip -q "$STAGE/upload.zip" -d "$EX"

          # Remove junk from macOS and any .git folders inside the ZIP
          rm -rf "$EX/__MACOSX"
          find "$EX" -name ".DS_Store" -type f -delete
          find "$EX" -name ".git" -prune -exec rm -rf {} +

          # Reject symlinks that point outside the extracted folder
          EXR="$(realpath "$EX")"
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) resolved="$(realpath -m "$target")" ;;
              *)  resolved="$(realpath -m "$(dirname "$link")/$target")" ;;
            esac
            case "$resolved" in
              "$EXR"|"$EXR"/*) ;;
              *)
                echo "::error::Unsafe symlink in ZIP: $link -> $target"
                exit 1
                ;;
            esac
          done < <(find "$EX" -type l -print0)

          if [ -z "$(ls -A "$EX")" ]; then
            echo "::error::ZIP has no project files."
            exit 1
          fi

          # GitHub does not accept single files above 100 MB.
          BIG="$(find "$EX" -type f -size +"${MAX_FILE_MB}"M | head -20)"
          if [ -n "$BIG" ]; then
            echo "::error::Files bigger than ${MAX_FILE_MB} MB found in the ZIP:"
            printf '%s\n' "$BIG"
            exit 1
          fi

          echo "ZIP extracted."

      # ==================================================
      # 8 + 9. DETECT PROJECT ROOT
      # One top-level folder   -> use that folder (flatten)
      # Files at the ZIP root  -> use the ZIP root
      # ==================================================
      - name: Detect project root
        if: steps.find.outputs.found == 'true'
        id: root
        run: |
          set -euo pipefail

          EX="$RUNNER_TEMP/zip-import/extract"
          ROOT="$EX"

          mapfile -t TOP < <(find "$EX" -mindepth 1 -maxdepth 1)

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ] && [ ! -L "${TOP[0]}" ]; then
            # A lone .github folder is project content, not a wrapper folder.
            if [ "$(basename "${TOP[0]}")" != ".github" ]; then
              ROOT="${TOP[0]}"
              echo "One top-level folder found. It will be flattened."
            fi
          fi

          echo "Project root: $ROOT"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"

      # ==================================================
      # IMPORT PROJECT
      # ==================================================
      - name: Import project
        if: steps.find.outputs.found == 'true'
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail

          EXCLUDES=(--exclude="/.git")

          if [ "$PAT_AVAILABLE" != "true" ]; then
            # GITHUB_TOKEN cannot push workflow changes, so skip them.
            EXCLUDES+=(--exclude="/.github/workflows/")
            echo "::warning::No GH_PAT secret. Workflow files inside the ZIP are skipped."
          fi

          rsync -a "${EXCLUDES[@]}" "$PROJECT_ROOT/" ./

          echo "Project imported."

      # ==================================================
      # 10. RESTORE IMPORTER WORKFLOW (and optional kept files)
      # ==================================================
      - name: Restore importer workflow
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/zip-import"

          cp -a "$STAGE/workflows/.github" ./

          if [ -d "$STAGE/keep" ]; then
            cp -a "$STAGE/keep/." ./
          fi

          WF_PATH="$(cat "$STAGE/workflow-path.txt")"
          if [ ! -f "$WF_PATH" ]; then
            echo "::error::Importer workflow was not restored. Nothing will be pushed."
            exit 1
          fi

          echo "Importer workflow restored: $WF_PATH"

      # ==================================================
      # 11. DELETE UPLOADED ZIP
      # ==================================================
      - name: Delete uploaded ZIP
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f "$ZIP"
          echo "Deleted $ZIP"

      # ==================================================
      # 12 + 13. COMMIT AND PUSH TO THE SAME BRANCH
      # (or open a pull request when PR_MODE is "true")
      # Runs only if every step before it passed.
      # Also writes a summary report on the run page.
      # ==================================================
      - name: Commit and push
        if: steps.find.outputs.found == 'true'
        id: push
        env:
          ZIP: ${{ steps.find.outputs.zip }}
          BACKUP: ${{ steps.backup.outputs.tag }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Nothing changed"
              echo ""
              echo "The ZIP had the same files as the repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Count changes. The uploaded ZIP itself is not counted as removed.
          STATUS="$(git diff --cached --name-status --no-renames)"
          ADDED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="A"{n++} END{print n+0}')"
          CHANGED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="M"{n++} END{print n+0}')"
          REMOVED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="D" && tolower($2) !~ /^[^\/]*\.zip$/ {n++} END{print n+0}')"
          OLD_COUNT="$(git ls-tree -r --name-only HEAD | awk 'tolower($0) !~ /^[^\/]*\.zip$/ {n++} END{print n+0}')"

          # Bad ZIP check: too many old files would be removed.
          if [ "$MAX_REMOVED_PERCENT" -gt 0 ] && [ "$OLD_COUNT" -ge 10 ]; then
            ZNAME="$(basename "$ZIP" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ZNAME" == *force* ]]; then
              echo "::notice::The ZIP name has the word force. Removal check skipped."
            else
              PERCENT=$(( REMOVED * 100 / OLD_COUNT ))
              if [ "$PERCENT" -gt "$MAX_REMOVED_PERCENT" ]; then
                echo "::error::This import removes $REMOVED of $OLD_COUNT old files ($PERCENT percent). The limit is $MAX_REMOVED_PERCENT percent. Nothing was pushed."
                echo "::error::If this is correct, put the word force in the ZIP name (example: project-force.zip) and upload again."
                {
                  echo "### Import stopped"
                  echo ""
                  echo "This ZIP would remove **$REMOVED of $OLD_COUNT** old files ($PERCENT percent)."
                  echo "The limit is $MAX_REMOVED_PERCENT percent. Nothing was pushed."
                  echo ""
                  echo "If this is correct, rename the ZIP to include the word force and upload again."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
          fi

          TITLE="Import project from ${ZIP#./} (+$ADDED ~$CHANGED -$REMOVED files)"
          BODY="Backup tag: ${BACKUP:-none}"

          {
            echo "### Import report"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| ZIP | ${ZIP#./} |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Mode | $( [ "$PR_MODE" = "true" ] && echo "pull request" || echo "direct push" ) |"
            echo "| Files added | $ADDED |"
            echo "| Files changed | $CHANGED |"
            echo "| Files removed | $REMOVED |"
            echo "| Backup tag | ${BACKUP:-none} |"
            echo ""
            echo "<details><summary>File list (first 200)</summary>"
            echo ""
            echo '```'
            printf '%s\n' "$STATUS" | sed -n '1,200p'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PR_MODE" = "true" ]; then
            BR="import/${GITHUB_RUN_ID}"
            git checkout -q -b "$BR"
            git commit -m "$TITLE" -m "$BODY"
            git push origin "$BR"

            if ! PR_URL="$(gh pr create \
                --base "$GITHUB_REF_NAME" \
                --head "$BR" \
                --title "$TITLE" \
                --body "$BODY")"; then
              echo "::error::The branch $BR was pushed, but the pull request could not be created."
              echo "Turn on: Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              exit 1
            fi

            echo "Pull request: $PR_URL"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # [skip ci] stops this push from starting the workflow again.
          git commit -m "$TITLE [skip ci]" -m "$BODY"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Import finished and pushed to ${GITHUB_REF_NAME}."

      # ==================================================
      # CLEAN OLD ACTION RUN HISTORY
      # Runs only after a successful import and push.
      # Keeps the newest KEEP_RUNS finished runs.
      # If DELETE_RUNS_OLDER_THAN_DAYS is above 0, only older runs go.
      # The current run stays (a running job cannot delete itself).
      # A problem here never undoes the import.
      # ==================================================
      - name: Delete old workflow runs
        if: steps.find.outputs.found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          KEEP="${KEEP_RUNS:-5}"
          DAYS="${DELETE_RUNS_OLDER_THAN_DAYS:-0}"

          CUTOFF=0
          if [ "$DAYS" -gt 0 ]; then
            CUTOFF=$(( $(date +%s) - DAYS * 86400 ))
          fi

          ROWS="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at)"')"

          SEEN=0
          KEPT=0
          DELETED=0
          FAILED=0

          while read -r id created; do
            if [ -z "$id" ] || [ "$id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi

            SEEN=$((SEEN + 1))
            if [ "$SEEN" -le "$KEEP" ]; then
              KEPT=$((KEPT + 1))
              continue
            fi

            if [ "$CUTOFF" -gt 0 ] && [ "$(date -d "$created" +%s)" -gt "$CUTOFF" ]; then
              KEPT=$((KEPT + 1))
              continue
            fi

            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" > /dev/null 2>&1; then
              DELETED=$((DELETED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done <<< "$ROWS"

          echo "Kept $KEPT runs. Deleted $DELETED old runs. Could not delete $FAILED."

      # ==================================================
      # START OTHER WORKFLOWS AFTER IMPORT (optional)
      # Uses TRIGGER_WORKFLOWS. Leave it empty to skip.
      # Skipped in PR mode (nothing is merged yet).
      # ==================================================
      - name: Start other workflows
        if: steps.push.outputs.changed == 'true' && env.TRIGGER_WORKFLOWS != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set -f

          for wf in $TRIGGER_WORKFLOWS; do
            if gh workflow run "$wf" --ref "$GITHUB_REF_NAME"; then
              echo "Started: $wf"
            else
              echo "::warning::Could not start $wf. Does it have workflow_dispatch?"
            fi
          done

  # ==================================================
  # RESTORE: put the repository back to a backup tag
  # ==================================================
  restore:
    if: inputs.action == 'restore'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this on a branch, not on a tag."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Restore from backup tag
        env:
          INPUT_TAG: ${{ inputs.backup_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet

          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="$(git tag -l 'backup-*' | awk -F- '{print $NF, $0}' | sort -rn | awk 'NR==1{print $2}')"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No backup tag found. Run an import first, or type a tag name."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::The tag name has unsafe characters."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag not found: $TAG"
            echo "Existing backup tags:"
            git tag -l 'backup-*' || true
            exit 1
          fi

          echo "Restoring to tag: $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the current workflow files. GITHUB_TOKEN cannot change them,
          # and the tools must not disappear.
          KEEPWF="$RUNNER_TEMP/keep-workflows"
          rm -rf "$KEEPWF"
          mkdir -p "$KEEPWF"
          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$KEEPWF/"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          git checkout "refs/tags/$TAG" -- .

          rm -rf .github/workflows
          if [ -d "$KEEPWF/workflows" ]; then
            mkdir -p .github
            cp -a "$KEEPWF/workflows" .github/
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "Already the same as $TAG. Nothing to do."
            {
              echo "### Nothing changed"
              echo ""
              echo "The repository already matches \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          STATUS="$(git diff --cached --name-status --no-renames)"
          ADDED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="A"{n++} END{print n+0}')"
          CHANGED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="M"{n++} END{print n+0}')"
          REMOVED="$(printf '%s\n' "$STATUS" | awk -F'\t' '$1=="D"{n++} END{print n+0}')"

          # [skip ci] stops this push from starting other workflows.
          git commit -m "Restore from $TAG (+$ADDED ~$CHANGED -$REMOVED files) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "### Restore report"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Tag | $TAG |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Files added | $ADDED |"
            echo "| Files changed | $CHANGED |"
            echo "| Files removed | $REMOVED |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Restore finished and pushed to ${GITHUB_REF_NAME}."

  # ==================================================
  # CLEAN-REPO: delete all files in the repository
  # ==================================================
  clean-repo:
    if: inputs.action == 'clean-repo'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this on a branch, not on a tag."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create backup tag
        id: backup
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="backup-before-clean-${GITHUB_RUN_ID}"
          git tag "$TAG" HEAD

          if git push origin "refs/tags/$TAG"; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Backup tag created: $TAG"

            # Keep the newest BACKUP_KEEP backup tags. Delete the rest.
            git ls-remote --tags --refs origin 'refs/tags/backup-*' \
              | awk '{print $2}' \
              | sed 's|^refs/tags/||' \
              | awk -F- '{print $NF, $0}' \
              | sort -rn \
              | awk -v keep="$BACKUP_KEEP" 'NR>keep {print $2}' \
              | while read -r OLD; do
                  if [ "$OLD" = "$TAG" ]; then
                    continue
                  fi
                  git push origin --delete "refs/tags/$OLD" || \
                    echo "::warning::Could not remove old backup tag: $OLD"
                done
          else
            echo "::error::Could not push the backup tag. Nothing was cleaned."
            exit 1
          fi

      - name: Clean repository
        env:
          BACKUP: ${{ steps.backup.outputs.tag }}
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/clean-keep"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/keep"

          # Always keep: workflows, .keep-files, and every path in .keep-files
          KEEP_LIST="$STAGE/keep-list.txt"
          printf '%s\n' ".github/workflows" ".keep-files" > "$KEEP_LIST"

          if [ -f .keep-files ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                ''|'#'*) continue ;;
              esac
              printf '%s\n' "$line" >> "$KEEP_LIST"
            done < .keep-files
          fi

          while IFS= read -r p; do
            p="${p#./}"
            p="${p%/}"
            if [ -z "$p" ]; then
              continue
            fi
            case "$p" in
              /*|..|../*|*/..|*/../*|.git|.git/*)
                echo "::error::Not allowed in the keep list: $p"
                exit 1
                ;;
            esac
            if [ -e "$p" ]; then
              rsync -aR -- "$p" "$STAGE/keep/"
              echo "Keeping: $p"
            fi
          done < <(sort -u "$KEEP_LIST")

          OLD_COUNT="$(git ls-files | wc -l)"

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$STAGE/keep/." ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository was already clean."
            echo "### Nothing to clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REMOVED="$(git diff --cached --name-status --no-renames | awk -F'\t' '$1=="D"{n++} END{print n+0}')"

          git commit -m "Clean repository (-$REMOVED of $OLD_COUNT files) [skip ci]" \
                     -m "Backup tag: ${BACKUP:-none}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "### Clean-Repo report"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Branch | $GITHUB_REF_NAME |"
            echo "| Files removed | $REMOVED of $OLD_COUNT |"
            echo "| Backup tag | ${BACKUP:-none} |"
            echo ""
            if [ -n "${BACKUP:-}" ]; then
              echo "To undo: run **Import Project ZIP** with action \`restore\` and tag \`$BACKUP\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Repository cleaned and pushed to ${GITHUB_REF_NAME}."

  # ==================================================
  # CLEAN-DEPLOY: delete the Deployments history
  # An active deployment cannot be deleted, so each one is
  # first marked "inactive", then deleted.
  # ==================================================
  clean-deploy:
    if: inputs.action == 'clean-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Delete deployments
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          KEEP_LATEST: ${{ env.DEPLOY_KEEP_LATEST }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -uo pipefail

          KEEP="${KEEP_LATEST:-0}"
          if ! printf '%s' "$KEEP" | grep -qE '^[0-9]+$'; then
            echo "::error::DEPLOY_KEEP_LATEST must be a number."
            exit 1
          fi

          ARGS=()
          if [ -n "$ENVIRONMENT" ]; then
            ARGS+=(-f "environment=$ENVIRONMENT")
          fi

          # Newest first.
          IDS="$(gh api --paginate -X GET \
            "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
            "${ARGS[@]}" --jq '.[].id')" || {
              echo "::error::Could not list deployments."
              exit 1
            }

          SEEN=0
          KEPT=0
          DELETED=0
          FAILED=0
          LAST_ERROR=""

          while read -r id; do
            if [ -z "$id" ]; then
              continue
            fi

            SEEN=$((SEEN + 1))
            if [ "$SEEN" -le "$KEEP" ]; then
              KEPT=$((KEPT + 1))
              continue
            fi

            # Show the real GitHub answer if something goes wrong.
            if ! OUT="$(gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
                -f state=inactive 2>&1)"; then
              echo "Deployment $id: could not set inactive: $OUT"
            fi

            if OUT="$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" 2>&1)"; then
              DELETED=$((DELETED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "::error::Deployment $id was NOT deleted. GitHub says: $OUT"
              LAST_ERROR="$OUT"
            fi
          done <<< "$IDS"

          echo "Found $SEEN. Kept $KEPT. Deleted $DELETED. Could not delete $FAILED."

          {
            echo "### Clean-Deploy report"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | ${ENVIRONMENT:-all} |"
            echo "| Found | $SEEN |"
            echo "| Kept | $KEPT |"
            echo "| Deleted | $DELETED |"
            echo "| Failed | $FAILED |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            {
              echo ""
              echo "**Some deployments were not deleted.** GitHub says:"
              echo ""
              echo '```'
              echo "$LAST_ERROR"
              echo '```'
              echo "If it says \"Resource not accessible\" or 403, add a GH_PAT secret (see notes)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
